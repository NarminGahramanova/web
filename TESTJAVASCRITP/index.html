<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>Robot Hərəkəti</title>
</head>
<body>

  <h2>Robot Hərəkət Komandaları</h2>
  <input type="text" id="commands" placeholder="Məs: RAALR" />
  <button id="runBtn">Hesabla</button>

  <p id="result"></p>

  <script>
   
    const dirs = ['UP', 'RIGHT', 'DOWN', 'LEFT'];

    document.getElementById('runBtn').onclick = function() {
      let commands = document.getElementById('commands').value.toUpperCase();
      let dir = 0, x = 0, y = 0;

      for (let c of commands) {
        if (c === 'R') dir = (dir + 1) % 4;
        else if (c === 'L') dir = (dir + 3) % 4;
        else if (c === 'A') {
          if (dir === 0) y++;
          else if (dir === 1) x++;
          else if (dir === 2) y--;
          else if (dir === 3) x--;
        }
      }

      document.getElementById('result').textContent =
      ( x: ${x}, y: ${y}, direction: ${dirs});
    };
  </script>

</body>
</html>
